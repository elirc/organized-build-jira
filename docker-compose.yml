services:
  buildjira:
    build:
      context: .
      dockerfile: apps/dotnet/BuildJira.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      BuildJira__DataFile: /app/Data/buildjira-data.json
      BuildJira__WebOrigin: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - buildjira-data:/app/Data

volumes:
  buildjira-data:

